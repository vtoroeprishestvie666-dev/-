
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homwork5</title>
    <link rel="stylesheet" href="stylex.css">
</head>

<body>
    <header>
        <h1>Homework5 форма-анкета</h1>
    </header>
    <main>
    <div class="container">
   <form>
    <fieldset>    
    <legend>Заповніть форму</legend>
    
        <p>
            <label for="firstname">Ім'я:</label>
            <input required type="text" id="firstname" name="firstname" placeholder="Ім'я" />
        </p>
        <p>
            <label for="lastname">Прізвище:</label>
            <input required type="text" id="lastname" name="lastname" placeholder="Прізвище" />
        </p>
        <p>
            <label for="email">Електронна адреса:</label>
            <input required type="email" id="email" name="email" placeholder="Електронна адреса" />
        </p>
        <p>
            <label for="phone">Номер телефону:</label>
            <input required type="tel" id="phone" name="phone" placeholder="Номер телефону" />
        </p>
    </fieldset>
<fieldset>
    <legend>Дані про ваш курс</legend>

    <p>
        <label for="course">Оберіть ваш курс</label>
        <select id="course" name="course" required>
            <option value="" selected disabled>Оберіть ваш курс</option>
            <option value="Front-end Basic">Front-end Basic</option>
            <option value="Front-end Pro">Front-end Pro</option>
            <option value="React JS">React JS</option>
            <option value="Node JS">Node JS</option>
        </select>
    </p>
    <p>Чи виконуєте ви домашнє завдання?</p>
    <p>
        <input type="radio" id="yes" name="homework" value="yes">
        <label for="yes">Так, виконую</label>
    </p>

    <p>
        <input required type="radio" id="no" name="homework" value="no">
        <label for="no">Ні, не встигаю</label>
    </p>

    <p>Додаткова інформація:</p>

    <p>
        <input type="checkbox" id="continue" name="continue" value="yes">
        <label for="continue">Буду продовжувати навчання</label>
    </p>

    <p>
        <input type="checkbox" id="english" name="english" value="yes">
        <label for="english">Додатково вивчаю англійську мову</label>
    </p>
    </fieldset>
    <p>
        <textarea id="comment" name="comment" placeholder="Comment"></textarea>
    </p>
    <button type="submit">Відправити</button>
    </form>
    </div>
</main>
</body>
</html>
